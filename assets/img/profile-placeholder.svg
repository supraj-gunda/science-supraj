    <circle cx="404" cy="440" r="160" fill="url(#cell)" fill-opacity="0.92"/>
    <circle cx="404" cy="440" r="82" fill="#f7f8f5"/>
    <circle cx="404" cy="440" r="43" fill="#c99a45"/>
  </g>
  <g fill="#fff" stroke="#0d766e" stroke-width="5">
