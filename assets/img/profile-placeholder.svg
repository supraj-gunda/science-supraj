<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract computational biology illustration</title>
  <desc id="desc">A layered illustration of cells, data nodes, and molecular structures.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dceee9"/>
      <stop offset="0.55" stop-color="#e8edf4"/>
      <stop offset="1" stop-color="#f4e8d9"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d766e"/>
      <stop offset="1" stop-color="#315d8b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14253b" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="900" rx="48" fill="url(#bg)"/>
  <g opacity="0.28" stroke="#315d8b" stroke-width="3">
    <path d="M70 180C220 40 360 95 440 220S650 350 750 230" fill="none"/>
